name: CI

on:
  push:
    branches: [ "main", "upstream34/vram-layout-fix" ]
  pull_request:
    branches: [ "main", "upstream34/vram-layout-fix" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang make

    - name: Fetch Phoenix firmware fixtures (linux-firmware)
      run: make fixtures

    - name: Build and run unit tests
      env:
        REQUIRE_FIXTURES: "1"
      shell: bash
      run: |
        set +e
        make test CXX=clang++ 2>&1 | tee test.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          # Surface the failing output as an annotation on the PR.
          msg=$(tail -n 25 test.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Unit tests failed::${msg}"
        fi
        exit "$status"

  upstream34-layout:
    runs-on: macos-15-intel
    steps:
    - name: Checkout complete source history for the pinned upstream baseline
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Test checked-in helpers with synthetic IOKit and shell fixtures
      run: make test-upstream34-layout
    - name: Compile and verify the identical original-plus-fix helpers
      run: python3 tools/upstream34_layout/build.py build/upstream34-layout-ci-private --compile
