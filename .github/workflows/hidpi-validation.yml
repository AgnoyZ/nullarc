name: Native HiDPI candidate validation
on:
  push:
    branches: [downstream/780m-tahoe]
    paths: ['src/phxaccel/PhxHiDPI.hpp', 'src/phxaccel/accel/phxfb.cpp', 'tools/phx_hidpi*', 'tools/test_hidpi.py', 'tests/test_hidpi*', '.github/workflows/hidpi-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-hidpi:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record compiler host and source revision
        run: |
          git rev-parse HEAD
          sw_vers
          uname -m
          xcrun clang --version
      - name: Check native override generation and refusal paths
        run: python3 -m unittest discover -s tests -p 'test_hidpi_tools.py' -v
      - name: Run actual framebuffer callback with ASan and UBSan
        run: python3 tools/test_hidpi.py
      - name: Checkout pinned MacKernelSDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: build-sdk
          persist-credentials: false
      - name: Compile and sign actual PhxAccel including PhxAMDFB
        run: |
          bash src/phxaccel/build.sh ./build-sdk
          codesign --verify --strict src/phxaccel/build/PhxAccel.kext
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'tools')
          from verify_artifacts import inspect_kext
          print('HIDPI_KEXT_REPORT=' + json.dumps(inspect_kext('src/phxaccel/build/PhxAccel.kext', 'com.luuumi.PhxAccel')))
          PY
      - name: Compile read-only CoreGraphics probe and inventory the non-target host
        run: |
          mkdir -p build
          xcrun clang -arch x86_64 -fobjc-arc -Wall -Wextra -Werror tools/phx_hidpi_probe.m -framework Foundation -framework CoreGraphics -o build/phx-hidpi-probe
          build/phx-hidpi-probe
      - name: Confirm tracked sources unchanged
        run: git diff --exit-code HEAD -- src tools tests
      - name: State evidence and publication limits
        run: echo 'Native compilation, signature, CPU policy and read-only host inventory only. No target GPU execution, installation or binary upload.'
