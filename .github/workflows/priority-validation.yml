name: Priority improvement validation
on:
  push:
    branches: [downstream/780m-tahoe]
    paths: ['src/phxbringup/**', 'src/phxaccel/**', 'src/nmplugin/**', 'Makefile', 'tests/test_nmplugin*', 'tests/surface_key*', 'tests/descriptor_mask/**', 'tools/iosurf/surface_sync_probe.m', 'tools/test_bo_create.py', 'tests/test_bo_create*', 'tools/test_metal_capabilities.py', 'tests/test_metal_capabilities*', 'tools/test_shader_cache.py', 'tests/test_cache*', 'tools/test_submit_begin.py', 'tests/test_submit_begin*', 'tools/test_hidpi.py', 'tests/test_hidpi*', 'tools/test_present_copy.py', 'tests/test_present_copy*', 'tests/test_copy_path.cpp', 'tools/test_translation_flight.py', 'tests/test_translation_flight*', 'tools/test_async_cache.py', 'tests/test_async_cache*', 'tools/test_async_library.py', 'tests/test_async_library*', 'tools/test_async_function.py', 'tests/test_async_function*', '.github/workflows/priority-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Exercise merged upstream topology definitions
        run: |
          make build/tests/test_phx_topology CXX=clang++ CXXFLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all"
          build/tests/test_phx_topology
      - name: Execute visible-row and packed-copy policies with sanitizers
        run: |
          mkdir -p build
          clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Isrc/phxaccel tests/test_copy_path.cpp -o build/copy-policy
          build/copy-policy
      - run: python3 tools/test_bo_create.py --out build/bo-create
      - run: python3 tools/test_metal_capabilities.py --out build/metal-capabilities
      - run: python3 tools/test_shader_cache.py --out build/shader-cache
      - run: python3 tools/test_submit_begin.py --out build/submit-begin
      - run: python3 tools/test_hidpi.py
      - name: Execute adopted read-only panel timing with sanitizers
        run: >-
          make test-panel-timing CXX=clang++
          CXXFLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - run: python3 tools/test_bo_retirement.py --out build/bo-retirement
      - run: python3 tools/test_context_retirement.py --out build/context-retirement
      - run: python3 tools/test_vm_walk_cleanup.py --out build/vm-walk-cleanup
      - name: Checkout pinned Vulkan headers for descriptor tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 6802bb4733b63ed5efd3adb308a6c885ef180ea1
          path: build-vulkan-headers
          persist-credentials: false
      - name: Execute adopted descriptor masks with sanitizers
        env:
          CPPFLAGS: -Ibuild-vulkan-headers/include
        run: make test-nmplugin-descriptor-mask
  native-components:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record actual source and compiler host
        run: |
          git rev-parse HEAD
          sw_vers
          xcrun clang --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: build-sdk
          persist-credentials: false
      - name: Execute allocation methods with sanitizers
        run: python3 tools/test_bo_create.py --out build/bo-create
      - name: Execute actual capability query bodies with sanitizers
        run: python3 tools/test_metal_capabilities.py --out build/metal-capabilities
      - name: Execute cache I/O and Foundation LRU with sanitizers
        run: python3 tools/test_shader_cache.py --out build/shader-cache
      - name: Execute actual translation entry sharing with ASan and UBSan
        run: python3 tools/test_translation_flight.py --out build/translation-flight
      - name: Execute actual translation entry sharing with ThreadSanitizer
        run: python3 tools/test_translation_flight.py --out build/translation-flight-tsan --sanitizer thread
      - name: Execute bounded cache writer and real atomic I/O with ASan and UBSan
        run: python3 tools/test_async_cache.py --out build/async-cache
      - name: Execute bounded cache writer and real atomic I/O with ThreadSanitizer
        run: python3 tools/test_async_cache.py --out build/async-cache-tsan --sanitizer thread
      - name: Execute actual async library APIs with ASan and UBSan
        run: python3 tools/test_async_library.py --out build/async-library
      - name: Execute actual async library APIs with ThreadSanitizer
        run: python3 tools/test_async_library.py --out build/async-library-tsan --sanitizer thread
      - name: Execute actual async function APIs with ASan and UBSan
        run: python3 tools/test_async_function.py --out build/async-function
      - name: Execute actual async function APIs with ThreadSanitizer
        run: python3 tools/test_async_function.py --out build/async-function-tsan --sanitizer thread
      - name: Execute actual submission refusal paths with sanitizers
        run: python3 tools/test_submit_begin.py --out build/submit-begin
      - name: Execute actual first native-submit refusal diagnostics with sanitizers
        run: python3 tools/test_submit_diagnostic.py --out build/submit-diagnostic
      - name: Execute actual framebuffer mode and unsupported color callbacks
        run: python3 tools/test_hidpi.py
      - name: Exercise merged upstream topology and deterministic wait model
        run: |
          make build/tests/test_phx_topology CXX=clang++ CXXFLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all"
          build/tests/test_phx_topology
          python3 - <<'PY'
          from pathlib import Path
          import shutil, subprocess, sys, tempfile
          sys.path.insert(0, 'tools')
          from pr_wait_seq_overlay import deterministic_wait
          with tempfile.TemporaryDirectory(prefix='phx-sync-wait-') as temp:
              root = Path(temp)
              for name in ('tests/test_wait_seq.cpp', 'src/phxbringup/PhxNativeABI.h', 'src/amd/phx_topology.h'):
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(name, target)
              with deterministic_wait(root):
                  binary = root / 'wait-model'
                  subprocess.run(['xcrun', 'clang++', '-std=c++17', '-Wall', '-Wextra', '-Werror',
                                  '-fsanitize=address,undefined', '-fno-sanitize-recover=all',
                                  str(root / 'tests/test_wait_seq.cpp'), '-o', str(binary)], check=True)
                  for _ in range(20):
                      subprocess.run([str(binary)], check=True)
          print('20 deterministic upstream model runs passed; not the actual kernel wait method or GPU execution')
          PY
      - name: Execute actual streaming and damage copies on host RAM
        run: python3 tools/test_present_copy.py --out build/present-copy
      - name: Execute adopted read-only panel timing with sanitizers
        run: >-
          make test-panel-timing CXX=clang++
          CXXFLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: Execute adopted sampler keys with ASan and UBSan
        run: make test-nmplugin-sampler-key
      - name: Execute adopted IOSurface registry and monitor keys with sanitizers
        run: make test-nmplugin-surface-key
      - name: Compile optional IOSurface GPU probe without executing it
        run: >-
          xcrun clang -O1 -g -fobjc-arc -Wall -Wextra -Werror
          tools/iosurf/surface_sync_probe.m
          -framework Foundation -framework Metal -framework IOSurface -framework IOKit
          -o build/tests/surface_sync_probe
      - name: Compile both kernel components without installation
        run: |
          bash src/phxbringup/build.sh ./build-sdk
          codesign --force --sign - src/phxbringup/build/PhxBringup.kext
          codesign --verify --strict src/phxbringup/build/PhxBringup.kext
          bash src/phxaccel/build.sh ./build-sdk
          codesign --verify --strict src/phxaccel/build/PhxAccel.kext
      - name: Checkout pinned Vulkan headers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 6802bb4733b63ed5efd3adb308a6c885ef180ea1
          path: build-vulkan-headers
          persist-credentials: false
      - name: Execute adopted descriptor masks with sanitizers
        env:
          CPPFLAGS: -Ibuild-vulkan-headers/include
        run: make test-nmplugin-descriptor-mask
      - name: Compile and sign actual Metal plugin without creating a device
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from build_userspace import build_plugin
          def run(*args):
              subprocess.run(args, check=True)
          print(json.dumps(build_plugin(Path('.'), Path('build-vulkan-headers'), Path('build/native'), run), indent=2))
          PY
      - name: Check source integrity and evidence limits
        run: |
          git diff --exit-code HEAD -- src tools tests
          echo 'Host contracts and compilation only. No target GPU execution, installation or binary upload.'
