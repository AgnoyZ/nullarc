name: Passive allocation capture contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fake-process-contracts:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exercise collector with fake identity commands and a fake reader only
        run: python3 -m unittest discover -s tests -p test_allocation_capture.py -v
      - name: Exercise independent observer on temporary files and fake collectors
        run: python3 -m unittest discover -s tests -p test_allocation_observer.py -v
      - name: Exercise startup coordinator and independent recovery with file-only commands
        run: python3 -m unittest discover -s tests -p test_allocation_coordinator.py -v
      - name: Exercise native desktop entrypoint and provider methods with fake IOKit only
        run: python3 -m unittest discover -s tests -p test_desktop_handoff.py -v
      - name: Exercise checked display adapters and retained history with fake I/O only
        run: python3 -m unittest discover -s tests -p test_desktop_startup.py -v
      - name: Verify source and execution scope
        run: |
          git diff --exit-code HEAD -- src tools tests
          echo 'Fake processes and temporary directory events only; no target service open, GPU work, installation or artifacts.'
